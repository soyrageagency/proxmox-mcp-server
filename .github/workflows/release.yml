# Build standalone `rageprox` binaries (Node SEA) for every OS on a tag, and
# attach them to the GitHub Release so users can install with no Node/npm.
#
# Trigger: push a tag like `v1.0.0`.
#
# Crafted by SoyRage Agency — https://soyrage.es/
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: rageprox-linux-x64
          - os: macos-13
            asset: rageprox-macos-x64
          - os: macos-latest
            asset: rageprox-macos-arm64
          - os: windows-latest
            asset: rageprox-windows-x64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build:sea
      - name: Stage asset
        shell: bash
        run: |
          mkdir -p out
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp build/rageprox.exe "out/${{ matrix.asset }}"
          else
            cp build/rageprox "out/${{ matrix.asset }}"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: out/${{ matrix.asset }}

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist-assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist-assets/*
          generate_release_notes: true
